<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Info - Vijay Sarathi R S</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 35%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated background particles */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(120, 119, 198, 0.1) 0%, transparent 50%);
      animation: float 20s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      33% { transform: translateY(-30px) rotate(0.5deg); }
      66% { transform: translateY(-20px) rotate(-0.5deg); }
    }

    .contact-container {
      position: relative;
      z-index: 1;
    }

    .contact-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 50px 40px;
      border-radius: 24px;
      box-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      max-width: 480px;
      width: 100%;
      text-align: center;
      position: relative;
      animation: slideUp 0.8s ease-out;
      transition: all 0.3s ease;
    }

    .contact-card:hover {
      transform: translateY(-10px);
      box-shadow: 
        0 35px 70px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-header {
      margin-bottom: 40px;
    }

    .card-title {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 0%, #a8a8a8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .card-subtitle {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 400;
    }

    .contact-item {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 24px 0;
      padding: 20px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .contact-item::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      transition: left 0.5s ease;
    }

    .contact-item:hover::before {
      left: 100%;
    }

    .contact-item:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    .contact-icon {
      width: 24px;
      height: 24px;
      margin-right: 16px;
      flex-shrink: 0;
      filter: brightness(0) invert(1);
      opacity: 0.8;
      transition: all 0.3s ease;
    }

    .contact-item:hover .contact-icon {
      opacity: 1;
      transform: scale(1.1);
    }

    .contact-content {
      flex: 1;
      text-align: left;
    }

    .contact-label {
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .contact-value {
      font-size: 16px;
      font-weight: 500;
      color: #ffffff;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .contact-value:hover {
      color: #64b5f6;
      text-shadow: 0 0 10px rgba(100, 181, 246, 0.3);
    }

    .contact-item.phone .contact-value {
      letter-spacing: 0.5px;
    }

    .glow-effect {
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg, #64b5f6, #7986cb, #64b5f6);
      border-radius: 26px;
      opacity: 0;
      z-index: -1;
      animation: rotate 3s linear infinite;
      transition: opacity 0.3s ease;
    }

    .contact-card:hover .glow-effect {
      opacity: 0.3;
    }

    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .social-badge {
      display: inline-flex;
      align-items: center;
      padding: 8px 16px;
      background: rgba(100, 181, 246, 0.1);
      border: 1px solid rgba(100, 181, 246, 0.3);
      border-radius: 20px;
      margin-top: 8px;
      transition: all 0.3s ease;
    }

    .social-badge:hover {
      background: rgba(100, 181, 246, 0.2);
      border-color: rgba(100, 181, 246, 0.5);
      transform: scale(1.05);
    }

    .linkedin-icon {
      width: 16px;
      height: 16px;
      margin-right: 8px;
      filter: brightness(0) invert(1);
    }

    /* Mobile responsiveness */
    @media (max-width: 600px) {
      .contact-card {
        margin: 20px;
        padding: 30px 25px;
      }
      
      .card-title {
        font-size: 24px;
      }
      
      .contact-content {
        text-align: center;
      }
      
      .contact-item {
        flex-direction: column;
        text-align: center;
      }
      
      .contact-icon {
        margin-right: 0;
        margin-bottom: 8px;
      }
    }
  </style>
</head>
